<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gold OI Dashboard · GC</title>
<meta name="description" content="Gold (GC) weekly options — Open Interest & Intraday Volume by strike, OI trade plan, and the day's tradeable SD zones.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%23c9920a'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=23">
</head>
<body>
<div class="page">

  <!-- ── HEADER ── -->
  <header>
    <div class="hdr-left">
      <div class="hdr-eyebrow">GOLD · COMEX GC WEEKLY OPTIONS</div>
      <h1 class="hdr-title">OI &amp; Intraday Volume</h1>
      <div class="hdr-sub" id="contract-line">—</div>
    </div>
    <div class="hdr-right">
      <button class="icon-btn" id="btn-theme" title="สลับธีม สว่าง/มืด">◑</button>
      <button class="icon-btn" id="btn-refresh" title="รีเฟรชข้อมูล">↻</button>
      <label class="auto-toggle" title="รีเฟรชอัตโนมัติทุก 1 นาที">
        <input type="checkbox" id="chk-auto"> auto
      </label>
    </div>
  </header>

  <div class="status-line"><span class="pulse" id="pulse"></span><span id="status">กำลังโหลด…</span></div>

  <!-- shown by app.js during the GitHub-Pages rebuild lag after a plan slot -->
  <div class="stale-banner" id="stale-banner" style="display:none"></div>

  <!-- ── 1. CHART (CME-style: Put/Call per strike · IV smile · futures marker · SD zones) ── -->
  <section class="chart-card" id="chart-card">
    <div class="toolbar">
      <div class="seg" role="tablist">
        <button class="seg-btn" id="seg-intraday" role="tab">Intraday</button>
        <button class="seg-btn" id="seg-oi" role="tab">OI</button>
        <button class="seg-btn" id="seg-both" role="tab">Both</button>
      </div>
      <div class="legend">
        <span class="lg lg-put">■ Put</span>
        <span class="lg lg-call">■ Call</span>
        <span class="lg lg-iv" id="lg-iv">┄ IV</span>
        <span class="lg lg-buy">▮ BUY zone</span>
        <span class="lg lg-sell">▮ SELL zone</span>
        <label class="auto-toggle" title="โหมดตรวจสอบ: แสดงจุด IV ต้นทางบนเส้น"><input type="checkbox" id="chk-ivpts"> จุด IV ต้นทาง</label>
      </div>
      <div class="mini-seg" title="หน่วยราคาบนแกน/แผน">
        <button class="mini-btn" id="px-fut">Futures</button>
        <button class="mini-btn" id="px-cfd">CFD</button>
      </div>
    </div>
    <div id="chart-panels"><div class="chart-empty">กำลังโหลดข้อมูล…</div></div>
    <div class="chart-tip" id="chart-tip"></div>
    <div class="chart-foot" id="chart-foot"></div>
  </section>

  <!-- ── 2. TRADE PLAN (OI walls per the books · ⭐ OI×SD confluence · one order per side) ── -->
  <section class="plan-card" id="plan"><!-- filled by app.js --></section>

  <!-- ── 3. TRADEABLE SD ZONES (teacher-sheet formula, locked once a day) ── -->
  <section class="sdz-card" id="sdz" style="display:none"><!-- filled by app.js --></section>

  <footer>
    <span>ข้อมูล: Barchart (CME) ผ่าน GoldOI bridge · แผน: OI ตามหนังสือ · โซน SD: ชีตครู</span>
    <span id="data-stamp"></span>
  </footer>

</div>

<script src="js/data.js?v=23"></script>
<script src="js/app.js?v=23"></script>
</body>
</html>
